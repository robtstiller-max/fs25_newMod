<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRS Badge Editor</title>
<style>
  :root { --bg:#1c1f24; --panel:#262b33; --line:#3a4150; --txt:#e8eaf0; --acc:#d9a422; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.45 system-ui, Segoe UI, Roboto, sans-serif;
         display:flex; height:100vh; overflow:hidden; user-select:none; }
  #side { width:300px; min-width:300px; background:var(--panel); border-right:1px solid var(--line);
          padding:14px; overflow-y:auto; }
  #side h1 { font-size:16px; margin:0 0 4px; color:var(--acc); }
  #side p.hint { color:#9aa3b2; font-size:12px; margin:6px 0 14px; }
  #side h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#9aa3b2;
             margin:16px 0 6px; }
  .row { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .row label { width:64px; color:#b8c0cd; font-size:12px; }
  .row input[type=number] { width:76px; background:#1a1e24; color:var(--txt);
             border:1px solid var(--line); border-radius:4px; padding:4px 6px; }
  .row input[type=range] { flex:1; accent-color:var(--acc); }
  .row input[type=text] { flex:1; background:#1a1e24; color:var(--txt);
             border:1px solid var(--line); border-radius:4px; padding:5px 7px; }
  button { background:#313945; color:var(--txt); border:1px solid var(--line); border-radius:5px;
           padding:7px 10px; cursor:pointer; font-size:13px; }
  button:hover { background:#3d4756; }
  button.primary { background:var(--acc); color:#20180a; border-color:var(--acc); font-weight:600; }
  button.primary:hover { background:#e7b53a; }
  #layers .layer { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:5px;
                   cursor:pointer; border:1px solid transparent; }
  #layers .layer:hover { background:#2e3540; }
  #layers .layer.sel { border-color:var(--acc); background:#2e3540; }
  #layers .layer .eye { width:22px; text-align:center; opacity:.9; }
  #layers .layer.hiddenL .name { opacity:.4; text-decoration:line-through; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; padding:20px;
           overflow:auto; background:
           repeating-conic-gradient(#22262c 0% 25%, #2a2f36 0% 50%) 0 0/28px 28px; }
  #wrap { position:relative; }
  #wrap svg { display:block; height:min(88vh, 1100px); width:auto;
              max-width:min(92vw, 1100px); touch-action:none; }
  #selbox { position:absolute; border:2px dashed var(--acc); pointer-events:none; display:none;
            box-shadow:0 0 0 1px rgba(0,0,0,.5); }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  small.note { color:#7d8695; font-size:11px; }
</style>
</head>
<body>
<div id="side">
  <h1>MRS Badge Editor</h1>
  <p class="hint">Drag layers on the canvas &middot; mouse-wheel over a layer to resize &middot; edit text below. Export when happy.</p>

  <h2>Layers</h2>
  <div id="layers"></div>

  <h2>Selected layer</h2>
  <div id="controls">
    <div class="row"><label>X</label><input type="number" id="cx" step="1"><label>Y</label><input type="number" id="cy" step="1"></div>
    <div class="row"><label>Scale</label><input type="range" id="cs" min="0.05" max="6" step="0.01"></div>
    <div class="row"><label>Rotate</label><input type="range" id="cr" min="-180" max="180" step="1"></div>
    <div id="textCtl" style="display:none">
      <div class="row"><label>Text</label><input type="text" id="ctext"></div>
      <div class="row"><label>Size</label><input type="number" id="csize" min="8" max="600" step="2"></div>
    </div>
    <div id="imgCtl" style="display:none">
      <div class="btnrow"><button id="swapImg">Replace image&hellip;</button></div>
    </div>
  </div>

  <h2>Base art</h2>
  <div class="row">
    <button id="baseClean" class="primary">Clean (no text)</button>
    <button id="baseOrig">Original (baked text)</button>
  </div>

  <h2>Export</h2>
  <div class="btnrow">
    <button id="expSvg" class="primary">Download SVG</button>
    <button id="expPng" class="primary">Download PNG</button>
    <button id="reset">Reset</button>
  </div>
  <p class="hint">SVG also opens in Inkscape / Illustrator / Figma (file: <small class="note">mrs_badge_editable.svg</small>). Exports embed all images so the file is self-contained.</p>
  <input type="file" id="file" accept="image/*" style="display:none">
</div>

<div id="stage"><div id="wrap"><div id="selbox"></div></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const wrap = $('#wrap'), selbox = $('#selbox');
let svg = null, layers = [], sel = null, drag = null, viewK = 1;
const state = new Map();

fetch('mrs_badge_editable.svg').then(r => r.text()).then(txt => {
  wrap.insertAdjacentHTML('afterbegin', txt);
  svg = wrap.querySelector('svg');
  layers = Array.from(svg.querySelectorAll('g[data-name]'));
  layers.forEach(g => {
    state.set(g, {
      x: +g.dataset.x || 0, y: +g.dataset.y || 0,
      s: +g.dataset.s || 1, r: +g.dataset.r || 0
    });
  });
  buildPanel();
  computeK();
  select(layers[1] || layers[0]);
  wireCanvas();
  window.addEventListener('resize', () => { computeK(); updateSelbox(); });
});

function computeK() { if (svg) viewK = svg.getBoundingClientRect().width / 1008; }

function applyT(g) {
  const st = state.get(g);
  g.setAttribute('transform', `translate(${st.x} ${st.y}) rotate(${st.r}) scale(${st.s})`);
  g.dataset.x = st.x; g.dataset.y = st.y; g.dataset.s = st.s; g.dataset.r = st.r;
  if (g === sel) { syncInputs(); updateSelbox(); }
}

function buildPanel() {
  const box = $('#layers'); box.innerHTML = '';
  [...layers].reverse().forEach(g => {
    const row = document.createElement('div');
    row.className = 'layer'; row.dataset.for = g.id;
    row.innerHTML = `<span class="eye">&#128065;</span><span class="name">${g.dataset.name}</span>`;
    row.querySelector('.eye').addEventListener('click', ev => {
      ev.stopPropagation();
      const hidden = g.style.display === 'none';
      g.style.display = hidden ? '' : 'none';
      row.classList.toggle('hiddenL', !hidden);
      updateSelbox();
    });
    row.addEventListener('click', () => select(g));
    box.appendChild(row);
  });
}

function select(g) {
  sel = g;
  document.querySelectorAll('#layers .layer').forEach(r =>
    r.classList.toggle('sel', r.dataset.for === g.id));
  const isText = g.dataset.kind === 'text';
  const isImg  = g.dataset.kind === 'image' && g.id !== 'layer-base';
  $('#textCtl').style.display = isText ? '' : 'none';
  $('#imgCtl').style.display  = isImg  ? '' : 'none';
  if (isText) {
    $('#ctext').value = g.querySelector('text').textContent;
    $('#csize').value = g.querySelector('text').getAttribute('font-size');
  }
  syncInputs(); updateSelbox();
}

function syncInputs() {
  if (!sel) return;
  const st = state.get(sel);
  $('#cx').value = Math.round(st.x); $('#cy').value = Math.round(st.y);
  $('#cs').value = st.s; $('#cr').value = st.r;
}

function updateSelbox() {
  if (!sel || sel.style.display === 'none' || !sel.getBoundingClientRect().width) {
    selbox.style.display = 'none'; return;
  }
  const r = sel.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  selbox.style.display = 'block';
  selbox.style.left = (r.left - w.left - 4) + 'px';
  selbox.style.top = (r.top - w.top - 4) + 'px';
  selbox.style.width = (r.width + 8) + 'px';
  selbox.style.height = (r.height + 8) + 'px';
}

function wireCanvas() {
  svg.addEventListener('pointerdown', e => {
    const g = e.target.closest('g[data-name]');
    if (!g) return;
    select(g);
    drag = { px: e.clientX, py: e.clientY, x0: state.get(g).x, y0: state.get(g).y };
    svg.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  svg.addEventListener('pointermove', e => {
    if (!drag || !sel) return;
    const st = state.get(sel);
    st.x = drag.x0 + (e.clientX - drag.px) / viewK;
    st.y = drag.y0 + (e.clientY - drag.py) / viewK;
    applyT(sel);
  });
  ['pointerup', 'pointercancel'].forEach(t =>
    svg.addEventListener(t, () => { drag = null; }));
  svg.addEventListener('wheel', e => {
    if (!sel) return;
    e.preventDefault();
    const st = state.get(sel);
    st.s = Math.min(6, Math.max(0.05, st.s * Math.exp(-e.deltaY * 0.0015)));
    applyT(sel);
  }, { passive: false });
}

$('#cx').addEventListener('input', e => { state.get(sel).x = +e.target.value; applyT(sel); });
$('#cy').addEventListener('input', e => { state.get(sel).y = +e.target.value; applyT(sel); });
$('#cs').addEventListener('input', e => { state.get(sel).s = +e.target.value; applyT(sel); });
$('#cr').addEventListener('input', e => { state.get(sel).r = +e.target.value; applyT(sel); });
$('#ctext').addEventListener('input', e => {
  sel.querySelectorAll('text').forEach(t => { t.textContent = e.target.value; });
  updateSelbox();
});
$('#csize').addEventListener('input', e => {
  sel.querySelectorAll('text').forEach(t => { t.setAttribute('font-size', +e.target.value); });
  updateSelbox();
});

$('#baseClean').addEventListener('click', () => setBase('assets/badge_base_clean.png'));
$('#baseOrig').addEventListener('click', () => setBase('assets/badge_base_original.png'));
function setBase(href) {
  svg.querySelector('#base-img').setAttribute('href', href);
  $('#baseClean').classList.toggle('primary', href.includes('clean'));
  $('#baseOrig').classList.toggle('primary', !href.includes('clean'));
}

let fileTarget = null;
$('#swapImg').addEventListener('click', () => { fileTarget = sel; $('#file').click(); });
$('#file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f || !fileTarget) return;
  const url = URL.createObjectURL(f);
  const img = fileTarget.querySelector('image:last-of-type') || fileTarget.querySelector('image');
  const probe = new Image();
  probe.onload = () => {
    const W = 300, H = W * probe.naturalHeight / probe.naturalWidth;
    img.setAttribute('href', url);
    img.setAttribute('x', -W / 2); img.setAttribute('y', -H / 2);
    img.setAttribute('width', W); img.setAttribute('height', H);
    img.style.display = '';
    fileTarget.querySelectorAll('rect, text').forEach(n => n.style.display = 'none');
    fileTarget.style.display = '';
    document.querySelectorAll('#layers .layer').forEach(r =>
      r.classList.toggle('hiddenL', r.dataset.for === fileTarget.id ? false : r.classList.contains('hiddenL')));
    select(fileTarget);
  };
  probe.src = url;
  e.target.value = '';
});

async function inlineImages(clone) {
  for (const img of clone.querySelectorAll('image')) {
    const href = img.getAttribute('href');
    if (!href || img.style.display === 'none') continue;
    try {
      const blob = await (await fetch(href)).blob();
      const bytes = new Uint8Array(await blob.arrayBuffer());
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000)
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      img.setAttribute('href',
        'data:' + (blob.type || 'application/octet-stream') + ';base64,' + btoa(bin));
    } catch (err) { console.warn('could not inline', href, err); }
  }
  return clone;
}

function serialized(clone) {
  clone.removeAttribute('style');
  clone.querySelectorAll('.sel').forEach(n => n.classList.remove('sel'));
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
         new XMLSerializer().serializeToString(clone);
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

$('#expSvg').addEventListener('click', async () => {
  const str = serialized(await inlineImages(svg.cloneNode(true)));
  download(new Blob([str], { type: 'image/svg+xml' }), 'mrs_badge_editable.svg');
});

$('#expPng').addEventListener('click', async () => {
  const str = serialized(await inlineImages(svg.cloneNode(true)));
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = 2016; c.height = 2134;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => download(b, 'mrs_badge.png'), 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
});

$('#reset').addEventListener('click', () => location.reload());
</script>
</body>
</html>
